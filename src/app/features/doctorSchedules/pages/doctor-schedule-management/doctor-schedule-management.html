<div class="p-4 sm:p-6 lg:p-8 flex flex-col gap-6 max-w-7xl mx-auto w-full">
  <!-- Toolbar with Stats and Action Buttons -->
  <app-schedule-toolbar></app-schedule-toolbar>

  <!-- Schedules Table Container -->
  <app-schedule-table></app-schedule-table>

  <!-- Pagination Controls -->
  @if (facade.schedules().length > 0 || facade.totalCount() > 0) {
    <app-pagination
      [pageNumber]="facade.pageNumber()"
      [pageSize]="facade.pageSize()"
      [totalCount]="facade.totalCount()"
      [totalPages]="facade.totalPages()"
      [disabled]="facade.isLoading()"
      (pageChange)="facade.setPage($event)"
      (pageEvent)="facade.setPageSize($event.pageSize)"
    />
  }

  <!-- Add/Edit Form Modal -->
  <app-schedule-form-modal></app-schedule-form-modal>

  <!-- Delete Confirm Modal -->
  <app-schedule-delete-modal></app-schedule-delete-modal>
</div>
